services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gta
      POSTGRES_PASSWORD: gta
      POSTGRES_DB: gta_phuket
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gta -d gta_phuket']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://gta:gta@postgres:5432/gta_phuket
      REDIS_URL: redis://redis:6379
      # Both default to the HTTPS dev origin: the web container proxies /api and
      # /socket.io, so the extension, the OAuth callback and the EventSub
      # callback all live behind one trusted origin. Override in .env when a
      # tunnel is in front.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://localhost:8080}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://localhost:8080}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Source is mounted so edits are picked up without a rebuild.
      - ./server/src:/app/server/src:ro
      - ./server/tsconfig.json:/app/server/tsconfig.json:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Serves every browser surface, including the three Twitch extension pages,
  # over HTTPS on 8080 — the origin Twitch Local Test is pointed at. Certificates
  # come from scripts/setup-certs.*; without them it falls back to plain HTTP and
  # says so in the logs.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    environment:
      WEB_PORT: 8080
      VITE_PROXY_TARGET: http://api:4000
      VITE_MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN}
      VITE_MAPBOX_STYLE_URL: ${MAPBOX_STYLE_URL:-mapbox://styles/mapbox/dark-v11}
      VITE_DEV_MODE: ${DEV_MODE:-false}
      VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - '8080:8080'
    depends_on:
      - api
    volumes:
      - ./web/src:/app/web/src:ro
      - ./web/public:/app/web/public:ro
      - ./web/scripts:/app/web/scripts:ro
      - ./web/vite.config.ts:/app/web/vite.config.ts:ro
      - ./web/tsconfig.json:/app/web/tsconfig.json:ro
      - ./web/index.html:/app/web/index.html:ro
      - ./web/video_overlay.html:/app/web/video_overlay.html:ro
      - ./web/mobile.html:/app/web/mobile.html:ro
      - ./web/config.html:/app/web/config.html:ro
      - ./web/streamer.html:/app/web/streamer.html:ro
      - ./web/obs.html:/app/web/obs.html:ro
      - ./web/admin.html:/app/web/admin.html:ro
      - ./web/dev.html:/app/web/dev.html:ro
      - ./.env:/app/.env:ro
      # Read-only: the container only ever reads the key, never writes one.
      - ./certs:/app/certs:ro

  # docker compose --profile test run --rm test
  test:
    profiles: ['test']
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://gta:gta@postgres:5432/gta_phuket_test
      REDIS_URL: redis://redis:6379/1
      DEV_MODE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/app/server/src:ro
      - ./server/test:/app/server/test:ro
    command: ['npm', 'run', 'test', '-w', 'server']

  # Opt-in public HTTPS tunnel for REAL TWITCH TEST:
  #
  #   docker compose --profile tunnel up -d cloudflared
  #   docker compose logs cloudflared | grep trycloudflare.com
  #
  # Twitch's servers cannot reach localhost, so EventSub needs a public URL.
  # Everything still runs here — the tunnel only forwards HTTPS to the local api
  # container. Nothing is deployed anywhere.
  #
  # Put the printed URL into PUBLIC_API_URL (and VITE_API_BASE), recreate api and
  # web, then press "СИНХР. EVENTSUB" in /admin so Twitch re-subscribes to the
  # new callback.
  cloudflared:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:latest
    # A quick tunnel needs no Cloudflare account and prints a random
    # https://<name>.trycloudflare.com URL. Set CLOUDFLARE_TUNNEL_TOKEN in .env
    # to use a named tunnel with a stable hostname instead.
    command: >
      sh -c 'if [ -n "$${CLOUDFLARE_TUNNEL_TOKEN}" ];
             then exec cloudflared tunnel --no-autoupdate run --token "$${CLOUDFLARE_TUNNEL_TOKEN}";
             else exec cloudflared tunnel --no-autoupdate --url http://api:4000; fi'
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
